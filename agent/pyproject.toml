[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xiazhigang@yev.com", email = "xiazhigang@yev.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
    "pydantic-ai>=2.69.0",
    "pydantic-ai-slim[mcp]>=2.69.0",
    "pydantic-ai-harness[coder,skills]>=0.69.0",
    "python-dotenv>=1.2.4",
    "socksio>=1.0.0",
    "sqlmodel>=0.0.50",
]

[project.scripts]
agent = "agent:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src", "tests"]
extraPaths = ["src"]
executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "tests", extraPaths = ["src"] },
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.5",
]
